# Preset: claude
# Provenance: Claude Code network access requirements page (code.claude.com/docs/en/network-config), read 2026-10-01. Partly verified (spike S6, docs/spikes.md): api.anthropic.com and platform.claude.com were used in an authenticated session; claude.ai was not observed.
# Rules are exact hostnames on port 443. Presets never contain relaxations (enforced by tests).
version: 1
description: "Claude Code: API and account sign-in (required)"
rules:
  - host: api.anthropic.com
  - host: claude.ai
  - host: platform.claude.com
