version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - sloglint
    - unconvert
    - misspell
    - nilerr
    - copyloopvar
  settings:
    sloglint:
      no-mixed-args: true
      attr-only: true
formatters:
  enable:
    - gofmt
    - goimports
