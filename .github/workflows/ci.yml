name: ci

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # Non-engine commands must work on every OS; engine-dependent tests skip themselves.
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      - run: go test -count=1 ./...
        if: runner.os == 'Windows'
      - name: Build static binary and smoke-test
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/cellwall ./cmd/cellwall
          ./dist/cellwall version
          ./dist/cellwall version --json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.13.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make cross

  # The spikes encode the security claims the topology depends on (see docs/spikes.md).
  # Running them on every change turns "we verified this once" into a regression test.
  topology-spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Show engine
        run: docker version && docker compose version
      # root is needed for the iptables DNS meter in s2.
      - name: Run spikes
        run: sudo -E env "PATH=$PATH" make spikes

  # Real containers: the gateway image, an internal+isolated sandbox network and an agent container,
  # attacked from the agent side (escape-suite checks 3-7 and 12). CELLWALL_E2E_REQUIRE makes a
  # missing Docker a failure instead of a silent skip.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # The generated-topology test builds the agent image, so it needs the gateway image first.
      - run: make gateway-image
      - run: make e2e
        env:
          CELLWALL_E2E_REQUIRE: "1"

  # Fuzzing the code that parses attacker-controlled bytes (ClientHello, CONNECT targets) and the
  # policy matcher. A short pass on every change; longer runs belong in a scheduled job.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=20s

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: make gateway-image
      - name: Image is minimal and runs as non-root
        run: |
          docker image inspect cellwall-gateway:dev --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}} size={{.Size}}'
          test "$(docker image inspect cellwall-gateway:dev --format '{{.Config.User}}')" = "65532:65532"
          # A scratch image has no shell to exec into.
          ! docker run --rm --entrypoint /bin/sh cellwall-gateway:dev -c true 2>/dev/null
