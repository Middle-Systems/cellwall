name: ci

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

# Least privilege: nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      # Non-engine commands must work on every OS; engine-dependent tests skip themselves.
      - run: go test -race -count=1 ./...
        if: runner.os != 'Windows'
      - run: go test -count=1 ./...
        if: runner.os == 'Windows'
      - name: Proxy overhead budget
        if: matrix.os == 'ubuntu-latest'
        run: make bench-check
      - name: Build static binary and smoke-test
        shell: bash
        run: |
          CGO_ENABLED=0 go build -trimpath -o dist/kennel ./cmd/kennel
          ./dist/kennel version
          ./dist/kennel version --json

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make cross

  # The spikes encode the security claims the topology depends on (see docs/spikes.md).
  # Running them on every change turns "we verified this once" into a regression test.
  topology-spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show engine
        run: docker version && docker compose version
      # root is needed for the iptables DNS meter in s2.
      - name: Run spikes
        run: sudo -E env "PATH=$PATH" make spikes

  # Real containers: the gateway image, an internal+isolated sandbox network and an agent container,
  # attacked from the agent side (escape-suite checks 3-7 and 12). KENNEL_E2E_REQUIRE makes a
  # missing Docker a failure instead of a silent skip.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The generated-topology test builds the agent image, so it needs the gateway image first.
      - run: make gateway-image
      - run: make e2e
        env:
          KENNEL_E2E_REQUIRE: "1"

  # Fuzzing the code that parses attacker-controlled bytes (ClientHello, CONNECT targets) and the
  # policy matcher. A short pass on every change; longer runs belong in a scheduled job.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=20s

  gateway-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make gateway-image
      - name: Image is minimal and runs as non-root
        run: |
          docker image inspect kennel-gateway:dev --format 'user={{.Config.User}} entrypoint={{.Config.Entrypoint}} size={{.Size}}'
          test "$(docker image inspect kennel-gateway:dev --format '{{.Config.User}}')" = "65532:65532"
          # A scratch image has no shell to exec into.
          ! docker run --rm --entrypoint /bin/sh kennel-gateway:dev -c true 2>/dev/null

  # The release pipeline on every change, minus signing and publishing: catches a broken
  # .goreleaser.yaml or a failing cross-build before a tag does.
  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # setup-go v7 unconditionally exports GOTOOLCHAIN=local; goreleaser requires a newer
      # Go than go.mod's minimum, so restore auto-switching for the rest of this job.
      - run: echo "GOTOOLCHAIN=auto" >> "$GITHUB_ENV"
      - run: go install github.com/goreleaser/goreleaser/v2@v2.18.2
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=sbom,sign,homebrew,scoop
      - name: Release binaries report their version and carry the Linux gateway
        run: |
          set -eu
          dist/linux_linux_amd64_v1/kennel version
          test "$(stat -c %s dist/hosted_darwin_arm64_v8.0/kennel)" -gt "$(stat -c %s dist/linux_linux_amd64_v1/kennel)"
      - run: sh scripts/install_test.sh
